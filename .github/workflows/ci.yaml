name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: lts/*
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Format, lint, and typecheck
        run: npm run check
      - name: Run tests
        run: npm run test:frontend

  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      frontend-url: ${{ steps.dev.outputs.deployment-url || steps.prod.outputs.deployment-url }}
    environment:
      name: cloudflare
    permissions:
      pull-requests: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: lts/*
          cache: npm
      - name: Install dependencies
        run: npm ci --workspace=frontend

      - name: (if PR) Log dev preview as pending 
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMMIT_SHA: ${{ github.sha }}
        run: 'echo "status: pending for commit $COMMIT_SHA"'
        continue-on-error: true

      - name: Build frontend
        run: npm run build:frontend

      - name: (if PR) Deploy dev preview
        if: github.event_name == 'pull_request'
        id: dev
        uses: cloudflare/wrangler-action@v3
        with:
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          workingDirectory: ./frontend
          command: versions upload --preview-alias ${{ format('pr-{0}', github.event.pull_request.number) }}
        # TODO: check if this env data is added to wrangler deployments
        env:
          WORKERS_CI_BRANCH: ${{ github.head_ref }}
          WORKERS_CI_COMMIT_SHA: ${{ github.sha }}
        continue-on-error: true

      - name: (if PR) Log dev preview as completed
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMMIT_SHA: ${{ github.sha }}
          COMMIT_URL: ${{ steps.dev.outputs.deployment-url }}
          PR_URL: ${{ steps.dev.outputs.deployment-alias-url }}
        run: 'echo "status: error or success\n commit URL: $COMMIT_URL \n PR URL: $PR_URL"'

      - name: (if on main) Deploy to production
        if: github.ref == 'refs/heads/main'
        id: prod
        uses: cloudflare/wrangler-action@v3
        with:
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          workingDirectory: ./frontend
          command: deploy

  test-e2e:
    needs: [test, deploy]
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.55.0-noble
      options: --init --ipc=host
    timeout-minutes: 30
    environment:
      name: argos
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: lts/*
          cache: npm
      - name: Install dependencies
        run: npm ci --workspace=e2e
      - name: Install Playwright Browsers
        run: npx --workspace=e2e playwright install --with-deps chromium
      - name: Run e2e tests
        env:
          FRONTEND_URL: ${{ needs.deploy.outputs.frontend-url }}
          ARGOS_TOKEN: ${{ secrets.ARGOS_TOKEN }}
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 30
