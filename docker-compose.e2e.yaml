# docker compose -f docker-compose.e2e.yaml up --build --abort-on-container-exit
services:
  frontend-preview:
    build: ./frontend
    ports:
      - '${FRONTEND_PROD_PORT:-5000}:${FRONTEND_PROD_PORT:-5000}'
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: sh -c "npm run build && npm run preview -- --port ${FRONTEND_PROD_PORT:-5000} --host"
    healthcheck:
      test: curl -f http://localhost:${FRONTEND_PROD_PORT:-5000} || exit 1
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
      start_interval: 3s

  e2e-tests:
    build: ./e2e
    depends_on:
      frontend-preview:
        condition: service_healthy
    environment:
      - FRONTEND_URL=http://localhost:${FRONTEND_PROD_PORT:-5000}
    volumes:
      - ./e2e:/app
      - /app/node_modules
    command: npm run test
    network_mode: host
    # https://playwright.dev/docs/docker#recommended-docker-configuration
    init: true
    ipc: host
    # cap_add:
    #   - SYS_ADMIN
